name: Coletar avisos da Marinha

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/coletar_avisos.py .
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add avisos.json boletim.json
          git diff --cached --quiet && exit 0
          git commit -m "avisos e boletim da Marinha: atualização automática"
          git push
